name: ALI-NEW GitHub Pages deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed root Ali Tree
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 -D /tmp/root-headers.txt "${PAGE_URL%/}/" -o /tmp/root-index.html
          grep -q '<title>شجرة علي | ALI-NEW Engineering Control Panel</title>' /tmp/root-index.html
          grep -q 'Current stage: A0 · Status: YELLOW' /tmp/root-index.html
          grep -q 'id="tree-crumbs"' /tmp/root-index.html
          echo "Root Ali Tree entry point contains the expected page title, stage evidence, and navigation container."
          echo "Relevant deployed response headers:"
          for name in content-security-policy strict-transport-security x-content-type-options referrer-policy permissions-policy x-frame-options; do
            value="$(grep -i "^${name}:" /tmp/root-headers.txt | tail -n 1 | sed "s/\r$//" || true)"
            if [ -n "$value" ]; then printf "%s\n" "$value"; else printf "%s: (not present)\n" "$name"; fi
          done
