name: ALI-NEW CORE Diagnostic Loop (Read-only)

on:
  push:
    branches: [main, "core/**"]
  pull_request:
    branches: [main]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run ID to inspect (optional)"
        required: false
        type: string
      issue_number:
        description: "Existing issue number to update with the durable result (optional)"
        required: false
        type: string
      changed_paths:
        description: "Optional exact repository paths, one per line"
        required: false
        type: string

concurrency:
  group: core-diagnostic-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test diagnostic and routing logic
        run: node --test tests/core-diagnostic.test.mjs tests/core-route-resolver.test.mjs

  diagnose:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.login == 'AligasSRM')
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run read-only evidence collection and routing
        id: diagnose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_CHANGED_PATHS: ${{ inputs.changed_paths }}
        run: node scripts/run-core-diagnostic.mjs

      - name: Upload structured diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-diagnostic-${{ github.run_id }}
          path: artifacts/core-diagnostic-report.json
          if-no-files-found: error
          retention-days: 30
